buildscript {
    ext {
        buildToolsVersion = "37.0.0"
        minSdkVersion = 24
        compileSdkVersion = 37
        targetSdkVersion = 36
        ndkVersion = "27.1.12297006"
        kotlinVersion = "2.2.0"
    }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath("com.android.tools.build:gradle")
        classpath("com.facebook.react:react-native-gradle-plugin")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin")
        classpath 'com.google.gms:google-services:4.4.4'
    }
}
 allprojects {
    repositories {

        maven {
            url = uri(project(":react-native-async-storage_async-storage").file("local_repo"))
            url 'https://api.mapbox.com/downloads/v2/releases/maven'
        }
    }
}

subprojects { p ->
    if (p.name == "stripe_stripe-react-native") {
        p.dependencies.components.withModule(
            "com.stripe:stripe-android-issuing-push-provisioning"
        ) { details ->
            details.allVariants {
                withDependencies { deps ->
                    deps.removeAll {
                        it.group == "com.google.android.gms" &&
                        it.name == "play-services-tapandpay"
                    }
                }
            }
        }
    }
}

apply plugin: "com.facebook.react.rootproject"
